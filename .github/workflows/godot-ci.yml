      - name: Run runtime test bridge smoke test
        shell: bash
        run: |
          set -o pipefail
          timeout 20s ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --scene res://tests/runtime_test_bridge_smoke.tscn 2>&1 | tee runtime-test-bridge-smoke.log
