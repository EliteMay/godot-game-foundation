            echo "Game flow smoke contains an error."
            exit 1
          fi
          grep -q "GAME_FLOW_SMOKE: PASS" game-flow-smoke.log

      - name: Run transition layer smoke test
        shell: bash
        run: |
          set -o pipefail
          timeout 20s ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --scene res://tests/transition_layer_smoke.tscn 2>&1 | tee transition-layer-smoke.log
