      - name: Run menu focus navigation smoke test
        shell: bash
        run: |
          set -o pipefail
          timeout 20s ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --scene res://tests/menu_focus_navigation_smoke.tscn 2>&1 | tee menu-focus-navigation-smoke.log
