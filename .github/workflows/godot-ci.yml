name: Godot CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Godot 4.7.2
        shell: bash
        run: |
          curl --fail --location --retry 3 --output godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.7.2-stable_linux.x86_64

      - name: Direct cold start
        shell: bash
        run: |
          set -o pipefail
          rm -rf .godot
          timeout 20s ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --quit-after 3 2>&1 | tee cold-start.log
          if grep -Eq "SCRIPT ERROR|(^|[[:space:]])ERROR:" cold-start.log; then
            echo "Direct cold start contains an error."
            exit 1
          fi

      - name: Import project
        shell: bash
        run: |
          set -o pipefail
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --import 2>&1 | tee import.log
          if grep -Eq "SCRIPT ERROR|(^|[[:space:]])ERROR:" import.log; then
            echo "Godot import contains an error."
            exit 1
          fi

      - name: Load demo scene
        shell: bash
        run: |
          set -o pipefail
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --quit-after 3 2>&1 | tee demo.log
          if grep -Eq "SCRIPT ERROR|(^|[[:space:]])ERROR:" demo.log; then
            echo "Demo scene contains an error."
            exit 1
          fi

      - name: Run foundation smoke test
        shell: bash
        run: |
          set -o pipefail
          timeout 20s ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --scene res://tests/foundation_smoke.tscn 2>&1 | tee foundation-smoke.log
          if grep -Eq "SCRIPT ERROR|(^|[[:space:]])ERROR:" foundation-smoke.log; then
            echo "Foundation smoke contains an error."
            exit 1
          fi
          grep -q "FOUNDATION_SMOKE: PASS" foundation-smoke.log

      - name: Run generic save system smoke test
        shell: bash
        run: |
          set -o pipefail
          timeout 20s ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --scene res://tests/save_system_smoke.tscn 2>&1 | tee save-system-smoke.log
          if grep -Eq "SCRIPT ERROR|(^|[[:space:]])ERROR:" save-system-smoke.log; then
            echo "Generic save system smoke contains an error."
            exit 1
          fi
          grep -q "SAVE_SYSTEM_SMOKE: PASS" save-system-smoke.log

      - name: Run settings system smoke test
        shell: bash
        run: |
          set -o pipefail
          timeout 20s ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --scene res://tests/settings_system_smoke.tscn 2>&1 | tee settings-system-smoke.log
          if grep -Eq "SCRIPT ERROR|(^|[[:space:]])ERROR:" settings-system-smoke.log; then
            echo "Settings system smoke contains an error."
            exit 1
          fi
          grep -q "SETTINGS_SYSTEM_SMOKE: PASS" settings-system-smoke.log

      - name: Run input system smoke test
        shell: bash
        run: |
          set -o pipefail
          timeout 20s ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --scene res://tests/input_system_smoke.tscn 2>&1 | tee input-system-smoke.log
          if grep -Eq "SCRIPT ERROR|(^|[[:space:]])ERROR:" input-system-smoke.log; then
            echo "Input system smoke contains an error."
            exit 1
          fi
          grep -q "INPUT_SYSTEM_SMOKE: PASS" input-system-smoke.log

      - name: Run game flow smoke test
        shell: bash
        run: |
          set -o pipefail
          timeout 20s ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --scene res://tests/game_flow_smoke.tscn 2>&1 | tee game-flow-smoke.log
          if grep -Eq "SCRIPT ERROR|(^|[[:space:]])ERROR:" game-flow-smoke.log; then
            echo "Game flow smoke contains an error."
            exit 1
          fi
          grep -q "GAME_FLOW_SMOKE: PASS" game-flow-smoke.log
