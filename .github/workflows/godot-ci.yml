      - name: Materialize and validate generated starter
        shell: bash
        run: |
          set -o pipefail
          rm -rf /tmp/godot-foundation-starter-ci
          mkdir -p /tmp/godot-foundation-starter-ci
          python3 tools/materialize_starter_fixture.py /tmp/godot-foundation-starter-ci

          ./Godot_v4.7.2-stable_linux.x86_64 --headless --path /tmp/godot-foundation-starter-ci --import 2>&1 | tee starter-import.log
          if grep -Eq "SCRIPT ERROR|(^|[[:space:]])ERROR:" starter-import.log; then
            echo "Generated starter import contains an error."
            exit 1
          fi

          ./Godot_v4.7.2-stable_linux.x86_64 --headless --path /tmp/godot-foundation-starter-ci --quit-after 3 2>&1 | tee starter-main.log
          if grep -Eq "SCRIPT ERROR|(^|[[:space:]])ERROR:" starter-main.log; then
            echo "Generated starter main scene contains an error."
            exit 1
          fi

          timeout 20s ./Godot_v4.7.2-stable_linux.x86_64 --headless --path /tmp/godot-foundation-starter-ci --scene res://tests/foundation_integration_smoke.tscn 2>&1 | tee starter-integration.log
          if grep -Eq "SCRIPT ERROR|(^|[[:space:]])ERROR:" starter-integration.log; then
            echo "Generated starter integration test contains an error."
            exit 1
          fi
          grep -q "FOUNDATION_INTEGRATION_SMOKE: PASS" starter-integration.log
