          if grep -Eq "SCRIPT ERROR|(^|[[:space:]])ERROR:" input-remap-control-smoke.log; then
            echo "Input remap control smoke contains an error."
            exit 1
          fi
          grep -q "INPUT_REMAP_CONTROL_SMOKE: PASS" input-remap-control-smoke.log

      - name: Run game flow smoke test
