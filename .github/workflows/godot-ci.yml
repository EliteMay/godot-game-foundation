      - name: Run integrated Foundation runtime smoke test
        shell: bash
        run: |
          set -o pipefail
          timeout 20s ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --scene res://tests/foundation_runtime_smoke.tscn 2>&1 | tee foundation-runtime-smoke.log
