      - name: Run pause menu shell smoke test
        shell: bash
        run: |
          set -o pipefail
          timeout 20s ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --scene res://tests/pause_menu_shell_smoke.tscn 2>&1 | tee pause-menu-shell-smoke.log
