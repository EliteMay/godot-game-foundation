            echo "Transition layer smoke contains an error."
            exit 1
          fi
          grep -q "TRANSITION_LAYER_SMOKE: PASS" transition-layer-smoke.log

      - name: Run async scene loader smoke test
        shell: bash
        run: |
          set -o pipefail
          timeout 20s ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --scene res://tests/async_scene_loader_smoke.tscn 2>&1 | tee async-scene-loader-smoke.log
