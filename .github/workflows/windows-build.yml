name: Windows Build

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-windows:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Godot 4.7.2
        shell: bash
        run: |
          curl --fail --location --retry 3 --output godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.7.2-stable_linux.x86_64

      - name: Install Godot 4.7.2 export templates
        shell: bash
        run: |
          curl --fail --location --retry 3 --output export_templates.tpz https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          rm -rf templates
          unzip -q export_templates.tpz
          test -d templates
          mkdir -p "$HOME/.local/share/godot/export_templates"
          rm -rf "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          mv templates "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          test -f "$HOME/.local/share/godot/export_templates/4.7.2.stable/windows_release_x86_64.exe"

      - name: Import project
        shell: bash
        run: |
          set -o pipefail
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --import 2>&1 | tee import.log
          if grep -Eq "SCRIPT ERROR|(^|[[:space:]])ERROR:" import.log; then
            echo "Godot import contains an error."
            exit 1
          fi

      - name: Validate build configuration
        shell: bash
        run: |
          set -o pipefail
          timeout 20s ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --scene res://tests/build_config_smoke.tscn 2>&1 | tee build-config-smoke.log
          if grep -Eq "SCRIPT ERROR|(^|[[:space:]])ERROR:" build-config-smoke.log; then
            echo "Build configuration smoke contains an error."
            exit 1
          fi
          grep -q "BUILD_CONFIG_SMOKE: PASS" build-config-smoke.log

      - name: Export Windows release
        shell: bash
        run: |
          set -o pipefail
          mkdir -p builds/windows
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --export-release "Windows Desktop" builds/windows/GodotGameFoundation.exe 2>&1 | tee windows-export.log
          if grep -Eq "SCRIPT ERROR|(^|[[:space:]])ERROR:" windows-export.log; then
            echo "Windows export contains an error."
            exit 1
          fi
          test -s builds/windows/GodotGameFoundation.exe
          file builds/windows/GodotGameFoundation.exe | tee windows-file.log
          grep -q "PE32" windows-file.log

      - name: Write build metadata
        shell: bash
        env:
          BUILD_SHA: ${{ github.sha }}
          BUILD_REF: ${{ github.ref }}
          BUILD_RUN_ID: ${{ github.run_id }}
        run: |
          APP_VERSION="$(sed -n 's/^config\/version="\([^"]*\)"/\1/p' project.godot)"
          test -n "$APP_VERSION"
          export APP_VERSION
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          metadata = {
              "app_name": "Godot Game Foundation",
              "app_version": os.environ["APP_VERSION"],
              "godot_version": "4.7.2",
              "platform": "Windows Desktop",
              "architecture": "x86_64",
              "commit": os.environ["BUILD_SHA"],
              "ref": os.environ["BUILD_REF"],
              "github_run_id": os.environ["BUILD_RUN_ID"],
              "signed": False,
          }

          path = Path("builds/windows/build-info.json")
          path.write_text(
              json.dumps(metadata, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: godot-game-foundation-windows-${{ github.sha }}
          path: |
            builds/windows/GodotGameFoundation.exe
            builds/windows/build-info.json
          if-no-files-found: error
          retention-days: 14
